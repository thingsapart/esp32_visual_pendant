; PlatformIO Project Configuration File
; ESP32-S3 Camera Companion for CNC Visual Pendant
;
; Captures images, applies perspective correction, diffs against the
; previous frame, and sends changed tiles as JPEG over ESP-NOW to the
; pendant display.
;
; Hardware: GOOUUU ESP32-S3-CAM (OV3660 DVP, 8MB Flash, 8MB PSRAM)
;
; Hold BOOT button during power-on to enter configuration mode (AP + web UI).

[platformio]
description   = ESP32-S3 Camera Companion (ESP-NOW)
boards_dir    = boards
extra_configs = ../shared_build.ini

[env:cam-goouuu-s3]
platform      = ${shared_platform_tasmota.platform}
platform_packages = ${shared_platform_tasmota.platform_packages}
framework     = arduino
board         = esp32-s3-cam-goouuu

monitor_speed = 115200
monitor_echo  = yes
; monitor_port  = /dev/cu.usbserial-10
monitor_dtr   = 0
monitor_rts   = 0
upload_speed  = 465300

board_build.filesystem    = littlefs
board_build.f_cpu         = 240000000L
board_build.f_flash       = 80000000L
board_build.flash_mode    = qio
board_build.psram_type    = opi
board_build.flash_size    = 8MB
board_upload.flash_size   = 8MB
board_upload.maximum_size = 8388608

lib_ldf_mode    = chain
lib_compat_mode = strict

build_flags =
    ${shared_base_build_flags.build_flags}
    -DESP32_HW=1
    -DCAM_COMPANION=1
    -DBOARD_HAS_PSRAM
    ; undefine any previous settings to avoid redefinition warnings
    -UARDUINO_USB_MODE
    -UARDUINO_USB_CDC_ON_BOOT
    ;-DARDUINO_USB_MODE=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=4
    ; leave ESP-IDF CONFIG_* symbols at framework defaults (sdkconfig)

    ; ---- Camera DVP pins (GOOUUU ESP32-S3-CAM / Freenove pattern) ----
    -DCAM_PIN_PWDN=-1
    -DCAM_PIN_RESET=-1
    -DCAM_PIN_XCLK=15
    -DCAM_PIN_SIOD=4
    -DCAM_PIN_SIOC=5
    -DCAM_PIN_Y2=11
    -DCAM_PIN_Y3=9
    -DCAM_PIN_Y4=8
    -DCAM_PIN_Y5=10
    -DCAM_PIN_Y6=12
    -DCAM_PIN_Y7=18
    -DCAM_PIN_Y8=17
    -DCAM_PIN_Y9=16
    -DCAM_PIN_VSYNC=6
    -DCAM_PIN_HREF=7
    -DCAM_PIN_PCLK=13
    ; ---- LED ----
    -DCAM_LED_PIN=48
    ; ---- BOOT button for config mode ----
    -DCAM_BOOT_PIN=0
    ; ---- ESP-NOW channel (must match hub) ----
    -DCAM_WIFI_CHANNEL=1

build_unflags =
    ${shared_base_build_flags.build_unflags}

lib_deps =
    esp32-camera
    Adafruit NeoPixel

monitor_filters = default

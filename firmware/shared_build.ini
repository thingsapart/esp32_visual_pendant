; ============================================================================
; SHARED BUILD CONFIGURATION - Used by both cnc_interface and c6_espnow_bridge
; ============================================================================
; This file contains shared platform versions and build configurations
; to ensure consistency across all firmware projects.

[shared_platform_tasmota]
; Shared Tasmota platform for all ESP32 projects
;platform               = https://github.com/tasmota/platform-espressif32/releases/download/2025.04.30/platform-espressif32.zip
platform               = https://github.com/tasmota/platform-espressif32/releases/download/2026.02.30/platform-espressif32.zip
platform_packages      =

[shared_base_config]
; Base configuration shared across all projects
framework              = arduino
monitor_speed          = 115200
monitor_echo           = yes
check_skip_packages    = yes
lib_archive            = no
lib_ldf_mode           = chain
lib_compat_mode        = strict

[shared_base_build_flags]
; Base build flags for release builds
build_unflags          = 
                         -flto
                         -fipa-pta
build_flags            = 
                        -Wno-deprecated-declarations
                        -Os
                        -free
                        -fno-lto
                        -fno-strict-aliasing
                        -Wreturn-type

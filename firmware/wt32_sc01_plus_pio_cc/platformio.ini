; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
description            = ESP32-based visual CNC pendant
src_dir                = src
lib_dir                = lib
boards_dir             = boards
build_cache_dir        = .pio
extra_configs          = 

[base_config]
framework              = arduino
board_build.filesystem = littlefs
monitor_speed          = 115200
monitor_echo           = yes
check_skip_packages    = yes
lib_archive            = no
lib_ldf_mode           = chain
lib_compat_mode        = strict
shared_libdeps_dir     = lib
lib_extra_dirs         =

[pendant]
build_unflags          =
build_flags            = -I$PROJECT_DIR/include

[esp_release]
extra_scripts          = 
build_unflags          = ${pendant.build_unflags}
build_flags            = ${pendant.build_flags}
                        -DCORE_DEBUG_LEVEL=0
                        -Wno-deprecated-declarations
                        -mtarget-align
                        -free
                        -fipa-pta
                        -Wreturn-type

[esp32_release]
build_unflags          = ${esp_release.build_unflags}
                        -mtarget-align
                        -fexceptions
build_flags            = ${esp_release.build_flags}
                        -mno-target-align
                        -fno-exceptions
lib_ignore             =
extra_scripts          = ${esp_release.extra_scripts}
monitor_filters        = esp32_exception_decoder

[esp32_debug]
extends                = esp32_release
build_unflags          = ${esp32_release.build_flags}
                        -DCORE_DEBUG_LEVEL=0
                        -DLOG_LOCAL_LEVEL=0
build_flags            = ${esp32_release.build_flags}
                        ; -- logging --
                        -DCORE_DEBUG_LEVEL=5
                        -DLOG_LOCAL_LEVEL=5
                        -DPIOENV=\"${PIOENV}\"
                        -DLOG_MAXIMUM_LEVEL_VERBOSE
                        -DLOG_DEFAULT_LEVEL_WARNING
                        -DLOG_TIMESTAMP_SOURCE_SYSTEM
                        -DCONFIG_ARDUHAL_ESP_LOG=1
                        ; -DCONFIG_LOG_COLORS=1
check_tool             = cppcheck
check_flags            = --enable=all
debug_tool             = esp-prog
debug_init_break       = tbreak setup

[platform32]
platform               = https://github.com/tasmota/platform-espressif32/releases/download/2025.04.30/platform-espressif32.zip
platform_packages      =
build_unflags          = ${esp32_release.build_unflags}
build_flags            = ${esp32_release.build_flags}

[esp32_build]
extends                = esp32_debug

[flash_4mb]
board_upload.flash_size=4MB
board_upload.maximum_size = 4194304

[flash_8mb]
board_upload.flash_size=8MB
board_upload.maximum_size = 8388608

[flash_16mb]
board_upload.flash_size = 16MB
board                   = esp32s3_qio_opi
board_upload.maximum_size = 16777216

[env:pendant32_base]
framework               = ${base_config.framework}
platform                = ${platform32.platform}
platform_packages       = ${platform32.platform_packages}
board_build.filesystem  = ${base_config.board_build.filesystem}
board_upload.flash_size = 8MB
board                   = esp32
monitor_speed           = ${base_config.monitor_speed}
monitor_echo            = ${base_config.monitor_echo}
check_skip_packages     = ${base_config.check_skip_packages}
monitor_filters         = ${esp32_build.monitor_filters}
lib_ldf_mode            = ${base_config.lib_ldf_mode}
lib_compat_mode         = ${base_config.lib_compat_mode}
lib_extra_dirs          = ${base_config.lib_extra_dirs}
lib_ignore              = ${esp32_build.lib_ignore}
build_unflags           = ${esp32_build.build_unflags}
build_flags             = ${esp32_build.build_flags}
                            -Iinclude
                            -I${PROJECT_DIR}/src/
                            ;-ftrack-macro-expansion=0 ; to avoid very long macro errors when using lv_views.h Macro DSL
                            ; ESP32
                            -DESP32_HW
                            -DESP32_HW=1
                            -DBOARD_HAS_PSRAM
                            ; Arduino settings.
                            -DARDUINO_LOOP_STACK_SIZE=10280
                            -DARDUINO_USB_MODE=1
                            -DARDUINO_RUNNING_CORE=1
                            -D ARDUINO_USB_MODE=1
                            -D ARDUINO_USB_CDC_ON_BOOT=1    
                            ; Version.
                            -DVER_MAJ=0
                            -DVER_MIN=0
                            -DVER_REV=1
                            ; LVGL.
                            -DLGFX_USE_V1=1
                            -DLV_CONF_INCLUDE_SIMPLE       ; for lvgl
                            -DLV_LVGL_H_INCLUDE_SIMPLE     ; for lv_drivers
                            -DLV_COMP_CONF_INCLUDE_SIMPLE  ; for components
                            ;-DLV_CONF_PATH="\"${PROJECT_DIR}/src/lv_conf.h>\"" 
                            ;-DLODEPNG_NO_COMPILE_ALLOCATORS ; use PSram functions
                            -DLV_PNG_USE_LV_FILESYSTEM=1   ; use lvgl filesystem api, drive L:\
                            -DLV_USE_FILESYSTEM=1
                            -DLITTLEFS=LittleFS
                            -DLV_USE_FS_ARDUINO_ESP_LITTLEFS=1     ; Use builtin Arduino LittleFS
                            ; -DSPIFFS_TEMPORAL_FD_CACHE     ; speedup opening recent files
board_build.f_cpu       = 240000000L
lib_deps                =
                            lovyan03/LovyanGFX
                            https://github.com/lvgl/lvgl
                            git+https://github.com/DaveGamble/cJSON.git
extra_scripts           =
                            ; pre:tools/auto_firmware_version.py
                            ; pre:tools/data_img_png_to_c.py -- disabled for now, does not support RBG565A8 eg
                            tools/littlefsbuilder.py
                            tools/esp_merge_bin.py
                            tools/analyze_elf.py

[env:display32]
extends                 = env:pendant32_base
build_flags             = ${env:pendant32_base.build_flags}
                          -DPENDANT_DISPLAY

[env:display32c3]
extends                 = env:display32
board                   = esp32c3
build_flags             = ${env:display32.build_flags}
lib_ignore              = ${env:display32.lib_ignore}

[env:display32s3]
extends                 = env:display32
board                   = esp32s3_qio_qspi
build_flags             = ${env:display32.build_flags}
                            -DARDUINO_ESP32S3_DEV
lib_ignore              = ${env:display32.lib_ignore}

[env:hub32]
extends                 = env:pendant32_base
build_flags             = ${env:pendant32_base.build_flags}
                            -DESP_NOW_HUB

[env:hub32s3]
extends                 = env:hub32
build_flags             = ${env:hub32.build_flags}
                            -DESP_NOW_HUB
                            -DARDUINO_ESP32S3_DEV
                            -D MACH_UART_PIN_TX=17
                            -D MACH_UART_PIN_RX=18

[env:hub-esp32s3-devkit_16mb]
extends                 = env:hub32s3, flash_16mb

[env:hub-esp32s3-devkit_8mb]
extends                 = env:hub32s3, flash_16mb

[env:display-guition-4848s040]
extends                 = env:display32s3
board                   = esp32s3_4848s040
build_flags             = ${env:display32s3.build_flags}
                            -DESP32_PARALLEL=1
                            -DST7796_DRIVER=1
                            -DTOUCH_DRIVER=0x6336
                            -DTFT_WIDTH=480
                            -DTFT_HEIGHT=480
                            -DSPI_FREQUENCY=20000000
                            -DI2C_TOUCH_FREQUENCY=400000
                            -DI2C_TOUCH_ADDRESS=0x38
                            -DI2C_TOUCH_PORT=1
                            -DTOUCH_SDA=6
                            -DTOUCH_SCL=5
                            ;-DENCODER_PIN_X=11
                            ;-DENCODER_PIN_Y=10
                            -DLV_COLOR_16_SWAP=0
                            -DGUITION_4848S040=1
                            -DLED_PIN=16
                            ; Serial:
                            ; Break USB Serial, make RRF serial work:
                            ;-DMACH_UART_PIN_TX=43
                            ;-DMACH_UART_PIN_RX=44
                            ; Break RRF, make USB serial work:
                            -DMACH_UART_PIN_TX=2
                            -DMACH_UART_PIN_RX=1
                            -DUSB_UART_PIN_TX=43
                            -DUSB_UART_PIN_RX=44
upload_speed            = 460800


[env:display-wt32-sc01-plus]
extends                 = env:display32s3
board                   = esp32s3_qio_qspi
build_flags             = ${env:display32s3.build_flags}
                            -DESP32_PARALLEL=1
                            -D LGFX_USE_V1=1
                            -D ST7796_DRIVER=1
                            -D TOUCH_DRIVER=0x6336
                            -D TFT_WIDTH=480
                            -D TFT_HEIGHT=320
                            -D SPI_FREQUENCY=20000000
                            -D TFT_RD=-1
                            -D TFT_WR=47
                            -D TFT_RS=0
                            -D TFT_D0=9
                            -D TFT_D1=46
                            -D TFT_D2=3
                            -D TFT_D3=8
                            -D TFT_D4=18
                            -D TFT_D5=17
                            -D TFT_D6=16
                            -D TFT_D7=15
                            -D TFT_CS=-1
                            -D TFT_RST=4
                            -D TFT_BUSY=-1
                            -D TFT_BCKL=45
                            -D I2C_TOUCH_FREQUENCY=400000
                            -D I2C_TOUCH_ADDRESS=0x38
                            -D I2C_TOUCH_PORT=1
                            -D TOUCH_SDA=6
                            -D TOUCH_SCL=5
                            -D ENCODER_PIN_X=11
                            -D ENCODER_PIN_Y=10
                            -D MACH_UART_PIN_TX=43
                            -D MACH_UART_PIN_RX=44
                            -D LV_COLOR_16_SWAP=0
                            -D WT32_SC01_PLUS=1
                            
upload_speed            = 921600
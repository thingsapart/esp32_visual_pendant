;***************************************************;
;         WT32 SC01 Plus with TFT 3.5"              ;
;               - Custom esp32-s3 board             ;
;               - st7796 TFT                        ;
;               - ft6336 touch controller           ;
;***************************************************;

[guition-4848s040]
extends = arduino_esp32s3_v2
board = esp32s3_qio_opi
; board_build.arduino.memory_type = qio_qspi
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
; upload_speed = 921600
upload_speed = 460800

# board_build.partitions = default_8MB.csv
board_build.partitions = partitions_8MB.csv

build_flags =
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}
    -mno-text-section-literals
    -mlongcalls 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D LGFX_USE_V1=1
    -D ST7796_DRIVER=1
    -D TOUCH_DRIVER=0x6336
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=480
    -D SPI_FREQUENCY=20000000
    -DESP32_PARALLEL
    -D I2C_TOUCH_FREQUENCY=400000
    -D I2C_TOUCH_ADDRESS=0x38
    -D I2C_TOUCH_PORT=1
    -D TOUCH_SDA=6
    -D TOUCH_SCL=5
    -D ENCODER_PIN_X=11
    -D ENCODER_PIN_Y=10
    -D MACH_UART_PIN_TX=43
    -D MACH_UART_PIN_RX=44
    -D LV_COLOR_16_SWAP=0
    -D GUITION_4848S040=1

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}
    ${lovyangfx.lib_deps}

board_upload.maximum_ram_size=2397152

[env:guition-4848s040_8MB]
extends = guition-4848s040, flash_8mb

[env:guition-4848s040_16MB]
extends = guition-4848s040, flash_16mb

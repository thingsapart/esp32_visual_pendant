;***************************************************;
;    JC3248W535C — 3.2" QSPI IPS, ESP32-S3-N8R8   ;
;      - AXS15231B  QSPI display (SPI2)            ;
;      - AXS15231B  integrated touch (I2C_NUM_0)   ;
;      - 8 MB QIO Flash  +  8 MB OPI PSRAM         ;
;***************************************************;
;
; Pin mapping:
;   QSPI LCD : CS=45  PCLK=47  D0=21  D1=48  D2=40  D3=39
;              RST=NC  BL=1  TE=38
;   I2C Touch: SCL=8  SDA=4  INT=NC  RST=NC  addr=0x3B
;
; Key sdkconfig differences vs. WT32-SC01-Plus:
;   Flash  : 8 MB (CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y)
;   PSRAM  : OPI 8 MB at 80 MHz (CONFIG_SPIRAM_MODE_OCT=y)
;   Bus    : QSPI — no parallel-bus / I80 config needed
;           *IMPORTANT* the display shares SPI2 with the on-board OPI
;           PSRAM.  DMA transfers from PSRAM will collide with the QSPI
;           LCD and lead to a mostly-black screen unless the LVGL buffers
;           are allocated from internal RAM (see driver/display_alloc()).
;   No encoder header fitted on this board

[jc3248w535c]
extends = arduino_esp32s3_v2
board = esp32s3_qio_opi
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram_type = opi
board_upload.flash_size = 8MB
upload_speed = 460800

board_build.partitions = partitions_8MB.csv

build_flags =
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LGFX_USE_V1=1
    ; Board identity
    -D JC3248W535C=1
    ; Display resolution (logical landscape after driver rotation=1)
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=320
    ; QSPI LCD pins
    -D TFT_CS=45
    -D TFT_PCLK=47
    -D TFT_D0=21
    -D TFT_D1=48
    -D TFT_D2=40
    -D TFT_D3=39
    -D TFT_RST=-1
    -D TFT_BCKL=1
    -D TFT_TE=38
    ; I2C Touch
    -D I2C_TOUCH_PORT=0
    -D I2C_TOUCH_ADDRESS=0x3B
    -D I2C_TOUCH_FREQUENCY=400000
    -D TOUCH_SCL=8
    -D TOUCH_SDA=4
    ; LVGL
    -D LV_COLOR_16_SWAP=0  ; display uses native RGB order, driver swaps if necessary
    ; Machine UART (adjust to match your CNC controller wiring)
    -D MACH_UART_PIN_TX=43
    -D MACH_UART_PIN_RX=44

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}

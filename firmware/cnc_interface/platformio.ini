; ─────────────────────────────────────────────────────────────────────────────
; JC8012P4A1 with C6 bridge via on-board SDIO (preferred — no extra wires)
;
; The C6 companion runs c6_espnow_bridge firmware with -D C6_BRIDGE_TRANSPORT_SDIO.
; No external wiring needed: the SDIO bus is already connected on the PCB.
;
; SDIO pin defaults (fully overridable via additional -D flags):
;   P4 GPIO43 = CLK   P4 GPIO44 = CMD
;   P4 GPIO39 = D0    P4 GPIO40 = D1   P4 GPIO41 = D2   P4 GPIO42 = D3
; ─────────────────────────────────────────────────────────────────────────────
[env:display-jc8012p4a1-sdio]
extends = env:display-jc8012p4a1
build_flags = ${env:display-jc8012p4a1.build_flags}
	; ---- Enable SDIO bridge backend in remote_comms_wrapper ----
	-D REMOTE_COMMS_C6_SDIO_BRIDGE
	; ---- P4 SDMMC host pins (adjust if your board differs) ----
	; -D C6_SDIO_CLK_PIN=43
	; -D C6_SDIO_CMD_PIN=44
	; -D C6_SDIO_D0_PIN=39
	; -D C6_SDIO_D1_PIN=40
	; -D C6_SDIO_D2_PIN=41
	; -D C6_SDIO_D3_PIN=42
	; -D C6_SDIO_BUS_WIDTH=4
	; -D C6_SDIO_FREQ_KHZ=20000

; ─────────────────────────────────────────────────────────────────────────────
; JC8012P4A1 with C6 bridge via external UART wires (fail-safe fallback)
;
; The C6 companion runs c6_espnow_bridge firmware with the default UART
; transport.  Requires two external wires between the PROG_C6 header and free
; P4 GPIO pins.
;
; Default wiring (overridable):
;   C6 PROG_C6 TXD (GPIO16) → P4 GPIO5   (C6_BRIDGE_UART_RX on P4 side)
;   C6 PROG_C6 RXD (GPIO17) ← P4 GPIO4   (C6_BRIDGE_UART_TX on P4 side)
; ─────────────────────────────────────────────────────────────────────────────
[env:display-jc8012p4a1-uart]
extends = env:display-jc8012p4a1
build_flags = ${env:display-jc8012p4a1.build_flags}
	; ---- Enable UART bridge backend in remote_comms_wrapper ----
	-D REMOTE_COMMS_C6_BRIDGE
	; ---- P4-side UART pins (must match C6 build flags) ----
	-D C6_BRIDGE_UART_NUM=1
	-D C6_BRIDGE_UART_TX=4
	-D C6_BRIDGE_UART_RX=5
	-D C6_BRIDGE_UART_BAUD=921600


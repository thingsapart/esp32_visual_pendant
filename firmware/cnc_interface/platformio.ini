                            -D DWC_MACHINE_MODE=1
lib_deps                 = ${env:display-wt32-sc01-plus.lib_deps}
                            arduino-libraries/ArduinoHttpClient
                            arduino-libraries/ArduinoMDNS

[env:display-jc1060p470]
extends                 = env:display32p4
; ESP32-P4 with JC1060P470 display (1024x600 MIPI JD9165, GT911 touch)
; ESP32-P4NRW32 & ESP32-C6-MINI-1U-N4 co-processors
framework               = arduino
; platform                = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform                = https://github.com/pioarduino/platform-espressif32.git
; platform                  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
platform                = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
; platform                = https://github.com/tasmota/platform-espressif32/releases/download/2025.08.30/platform-espressif32-2025.08.30.zip
; board                   = esp32p4
;board                   = esp32p4_ev
build_flags             =
                            -fexceptions
                            -Iinclude
                            -I lvgl_ui
                            -I${PROJECT_DIR}/src/
                            -I${sysenv.HOME}/.platformio/**
                            ; App
                            -D APP_PENDANT
                            -D LVGL_UI_RUNTIME
                            -D ESP32_LVGL_ESP_DISP
                            ; ESP32
                            -D ESP32_HW
                            -D ESP32_HW=1
                            -D ESP32P4_HW
                            -D BOARD_HAS_PSRAM
                            -D CORE_DEBUG_LEVEL=5
                            ; Hardware/Board.
                            -D JC1060P470_BOARD
                            -D JC1060P470
                            -D TFT_WIDTH=1024
                            -D TFT_HEIGHT=600
                            -D ENCODER_PIN_X=47
                            -D ENCODER_PIN_Y=48
                            ; Arduino settings.
                            -D ARDUINO_LOOP_STACK_SIZE=10280
                            -D ARDUINO_RUNNING_CORE=1
                            ;-D ARDUINO_USB_MODE=1
                            ;-D ARDUINO_USB_CDC_ON_BOOT=1
                            ; Version.
                            -D VER_MAJ=0
                            -D VER_MIN=0
                            -D VER_REV=1
                            ; LVGL.
                            -D LGFX_USE_V1=1
                            -D LV_CONF_INCLUDE_SIMPLE       ; for lvgl
                            -D LV_LVGL_H_INCLUDE_SIMPLE     ; for lv_drivers
                            -D LV_COMP_CONF_INCLUDE_SIMPLE  ; for components
                            -D LV_PNG_USE_LV_FILESYSTEM=1   ; use lvgl filesystem api, drive L:\
                            -D LV_USE_FILESYSTEM=1
                            -D LITTLEFS=LittleFS
                            -D LV_USE_FS_ARDUINO_ESP_LITTLEFS=1     ; Use builtin Arduino LittleFS
                            -D CONFIG_LV_DISP_DEF_REFR_PERIOD=33 ; Example, match your LVGL settings
                            ; Tearing Fix defines (can also be in a local config header)
                            -D LVGL_PORT_AVOID_TEAR_ENABLE=1
                            -D LVGL_PORT_AVOID_TEAR_MODE=3
                            -D LVGL_PORT_PPA_ROTATION_ENABLE=0 ; 0 for no PPA, 1 for PPA rotation
                            ;-D LV_CONF_PATH="\"${PROJECT_DIR}/src/lv_conf.h>\""
                            ;-D LODEPNG_NO_COMPILE_ALLOCATORS ; use PSram functions
                            ;-D USB_UART_PIN_RX=38
                            ;-D USB_UART_PIN_TX=37
                            ; Settings for esp_wifi_remote and co-processor communication
                            ; These are often set via menuconfig in pure ESP-IDF projects.
                            ; For Arduino/PlatformIO, they might require specific SDKconfig fragments or defines.
                            ; -D CONFIG_ESP_WIFI_REMOTE_ENABLE=y (example Kconfig define)
                            ; -D CONFIG_ESP_WIFI_REMOTE_TRANSPORT_SHPI=y (example Kconfig define)
                            ; -D CONFIG_ESP_WIFI_REMOTE_INIT_CONFIG_DEFAULT_ESP32C6=y (example)
board_build.components_dir = $PROJECT_DIR/components
lib_deps                = ${env:pendant32_base.lib_deps}
                            ; https://github.com/esp-arduino-libs/ESP32_Display_Panel
                            ; esp-arduino-libs/esp-lib-utils
                            ; https://github.com/esp-arduino-libs/ESP32_IO_Expander

; ESP32-P4 usually has Octal PSRAM and Flash
;board_build.flash_mode = dio ; Or qio/oio depending on board
;board_build.psram_type = opi ; Or qspi
;board_build.mcu = esp32p4
;board_build.psram = enabled
;board_build.flash_size = 16MB
;board_build.f_cpu = 360000000L
;board_build.flash_mode = qio
;monitor_speed = 115200
; For ESP32-P4, you might need a newer version of the platform and framework
; platform = https://github.com/espressif/platform-espressif32.git#feature/esp32p4 (or similar development branch)
; platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#master (or a P4 supporting branch/tag)

;upload_protocol         = esp-builtin-usb-jtag ; Common for P4 devkits, or esptool
;upload_speed            = 921600 ; Adjust as needed

; Enable coredump to flash for ESP32-P4 (requires partition table with coredump partition)
; board_build.embed_txtfiles = sdkconfig.defaults ; where sdkconfig.defaults enables coredump
; Ensure your partitions.csv has a coredump partition.
; Example sdkconfig options to enable in sdkconfig.defaults:
; CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y
; CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=y
; CONFIG_ESP_COREDUMP_MAX_TASKS_NUM=16

;board = esp32-p4
;board = esp32p4_ev
board = esp32-p4-evboard
board_build.flash_size = 16MB
board_build.partitions = config/esp32/partitions_16MB_4MB_app.csv
board_build.f_cpu = 360000000L
;board_build.flash_mode = qio
board_build.psram = enabled
board_build.psram_type = opi ; Or qspi
;board_build.f_flash = 200000000L     ; Set flash frequency to 200MHz
board_upload.maximum_size = 16777216
;board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
;board_build.arduino.memory_type = opi_opi
;board_build.f_flash = 80000000L
;====
monitor_speed = 115200
upload_speed = 460800
custom_sdkconfig =  CONFIG_SPIRAM=y
                    CONFIG_SPIRAM_MODE_OCT=y
                    CONFIG_ESP_DEFAULT_PSRAM_CLK_IO=200
                    CONFIG_SPIRAM_SPEED_200M=y
                    CONFIG_SPIRAM_SPEED_120M=n
                    CONFIG_SPIRAM_SPEED_80M=n
                    CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
                    CONFIG_ESPTOOLPY_FLASHFREQ="80m"
                    CONFIG_LIBSODIUM_USE_MBEDTLS_SHA=n
                    CONFIG_ESPTOOLPY_FLASHSIZE_8MB=n
                    CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
                    CONFIG_CXX_EXCEPTIONS=y
                    ;CONFIG_ESP_WIFI_REMOTE_ENABLE=n
                    ;CONFIG_ESP_WIFI_REMOTE_TRANSPORT_SHPI=n

[env:display-emulator-64bits]
extends                 = env:base_config_native
lib_extra_dirs          = ./lvgl_ui/pio_library
lib_deps                = https://github.com/lvgl/lvgl
                            git+https://github.com/DaveGamble/cJSON.git
                            symlink://lvgl_ui/pio_library
build_type              = debug
platform                = native
extra_scripts           = pre:tools/sdl2_paths.py ; Tries to find SDL2 include and lib paths on your system - specifically for MacOS w/ Homebrew
                            post:tools/sdl2_build_extra.py
build_unflags           = ${env:pendant32_base.build_unflags}
                            -mtarget-align
                            -fipa-pta
                            -free
                            -mno-target-align
                            -D ESP32_HW
                            -D ESP32_HW=1
                            -DBOARD_HAS_PSRAM
                            ; Arduino settings.
                            -D ARDUINO_LOOP_STACK_SIZE=10280
                            -D ARDUINO_RUNNING_CORE=1
                            -D ARDUINO_USB_MODE=1
                            -D ARDUINO_USB_CDC_ON_BOOT=1
                            -D LV_USE_FS_ARDUINO_ESP_LITTLEFS=1

build_flags             = ${env:pendant32_base.build_flags}
                            -I${PROJECT_DIR}/src/
                            ;-D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
                            -D LV_LOG_PRINTF=1
                            -UESP32_HW
                            -lSDL2
                            -lpng
                            -D POSIX
                            -I /opt/homebrew/include/
                            -L /opt/homebrew/lib/
                            -Og
                            -g
                            ; SDL drivers options
                            -D LV_LVGL_H_INCLUDE_SIMPLE
                            -D LV_DRV_NO_CONF
                            -D LV_USE_FS_POSIX=1
                            -D LV_USE_SDL
                            -D SDL_HOR_RES=480
                            -D SDL_VER_RES=320
                            -D SDL_ZOOM=1
                            -D LV_SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
                            ; LVGL memory options, setup for the demo to run properly
                            -D LV_MEM_CUSTOM=1
                            -D LV_MEM_SIZE="(128U * 1024U)"
                            -D MACHINE_SIM

[env:generate-ui-component-impls]
extends                 = env:display-emulator-64bits
build_src_filter        = -<**/*.c>
                            +<ui/components/*.def.h>
extra_scripts           = pre:tools/gen_views.py

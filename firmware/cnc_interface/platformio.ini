; ─────────────────────────────────────────────────────────────────────────────
; Makerfabs / Jingcai JC3248W535C — 3.2" 320×480 IPS QSPI, ESP32-S3-N8R8
;   Display : AXS15231B (QSPI / SPI2)
;             CS=45  PCLK=47  D0=21  D1=48  D2=40  D3=39  RST=NC  BL=1  TE=38
;   Touch   : AXS15231B integrated (I2C_NUM_0, addr=0x3B)
;             SCL=8  SDA=4  INT=NC  RST=NC
;   Flash   : 8 MB QIO (N8)    PSRAM : 8 MB OPI (R8)
;   Logical : 480×320 landscape after driver rotation=1
;
; sdkconfig differences vs. WT32-SC01-Plus:
;   • 8 MB flash  → CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y  (not 16 MB)
;   • OPI PSRAM   → CONFIG_SPIRAM_MODE_OCT=y (same as wt32-sc01-plus OPI)
;   • QSPI bus    → no I80 / parallel GPIO config needed
;   • No encoder  → no ENCODER_PIN_X/Y defines required
;   • I2C_NUM_0   → touch on port 0 (not 1), SCL shares GPIO8 with the QSPI
;                   DC opcode field (harmless: QSPI DC is encoded in command
;                   byte, not toggled as a real GPIO in QSPI mode)
; ─────────────────────────────────────────────────────────────────────────────
[env:display-jc3248w535c]
extends = env:display32s3
board = esp32s3_qio_opi
board_build.f_flash = 80000000L
board_build.flash_freq = 80m
board_build.psram_type = opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = config/esp32/partitions_8MB.csv
lib_extra_dirs = ${env:display32s3.lib_extra_dirs}
extra_scripts = pre:tools/patch_lgfx_c3.py
lib_deps = 
	${env:display32s3.lib_deps}
	esp-arduino-libs/esp-lib-utils
	https://github.com/esp-arduino-libs/ESP32_IO_Expander
	https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
build_flags = ${env:display32s3.build_flags}
	;-D ESP32_LVGL_ESP_DISP
	;-D NO_TOUCH_CAL
	; enable esp_panel touch driver even when ESP32_LVGL_ESP_DISP is off
	; if you undefine this symbol the old raw-I2C touch code will be used
	-D JC3248W535C_ESP_DISP_TOUCH
	-D ESP_PANEL_DRIVERS_BUS_ENABLE_QSPI=1
	-D ESP_PANEL_DRIVERS_BUS_USE_QSPI=1
	-D ESP_PANEL_DRIVERS_BUS_ENABLE_I2C=1
	-D ESP_PANEL_DRIVERS_BUS_USE_I2C=1
	-D ESP_PANEL_DRIVERS_BUS_ENABLE_SPI=1
	-D ESP_PANEL_DRIVERS_LCD_ENABLE_AXS15231B=1
	-D ESP_PANEL_DRIVERS_LCD_USE_AXS15231B=1
	-D ESP_PANEL_DRIVERS_TOUCH_ENABLE_AXS15231B=1
	-D ESP_PANEL_DRIVERS_TOUCH_USE_AXS15231B=1
	-D ESP_PANEL_DRIVERS_BACKLIGHT_ENABLE_PWM_LEDC=1
	-D ESP_PANEL_DRIVERS_BACKLIGHT_USE_PWM_LEDC=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; ── Board identity ────────────────────────────────────────────────────
	-D JC3248W535C=1
	; ── Display resolution (logical, after rotation=1 in driver) ─────────
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	; ── QSPI LCD pins ─────────────────────────────────────────────────────
	-D TFT_CS=45
	-D TFT_PCLK=47
	-D TFT_D0=21
	-D TFT_D1=48
	-D TFT_D2=40
	-D TFT_D3=39
	-D TFT_RST=-1
	-D TFT_BCKL=1
	-D TFT_TE=38
	; ── I2C Touch (AXS15231B integrated, I2C_NUM_0) ───────────────────────
	-D I2C_TOUCH_PORT=0
	-D I2C_TOUCH_ADDRESS=0x3B
	-D I2C_TOUCH_FREQUENCY=400000
	-D TOUCH_SCL=8
	-D TOUCH_SDA=4
	; ── Machine / comms UART (adjust if your wiring differs) ──────────────
	-D MACH_UART_PIN_TX=43
	-D MACH_UART_PIN_RX=44
	; ── LVGL colour — AXS15231B outputs RGB natively, no byte-swap needed ─
	-D LV_COLOR_16_SWAP=0
	; ── Memory: move LVGL task stack to PSRAM (internal SRAM exhausted by UI) ─
	-D LVGL_TASK_PSRAM=1
	; ── Arduino loop task stack: HWM at display_alloc() was only ~2 KB used  ─
	-D ARDUINO_LOOP_STACK_SIZE=3076

upload_speed = 460800
build_src_filter = +<*> +<../lvgl_ui/lu_utils.c>
	-<driver/esp_lvgl/*.cpp>
	+<driver/esp_lvgl/simd/*.S>
	-<driver/esp_lvgl/simd/lv_color_blend_to_argb8888_esp32.S>
	-<driver/esp_lvgl/simd/lv_color_blend_to_rgb565_esp32.S>
	-<driver/esp_lvgl/simd/lv_color_blend_to_rgb888_esp32.S>
	-<driver/esp_lvgl/ppa>
	-<data/img/img_probe_icon_*>
custom_sdkconfig =
	CONFIG_SPIRAM=y
	CONFIG_SPIRAM_MODE_OCT=y
	CONFIG_SPIRAM_SPEED_80M=y
	; Route large malloc() requests (>4 KB) to PSRAM so that task stacks
	; (machine tasks: 6–8 KB) are allocated from PSRAM instead of the
	; scarce internal SRAM.  Small FreeRTOS primitives (≤4 KB) still
	; go to internal SRAM, keeping ISR latency unaffected.
	CONFIG_SPIRAM_USE_MALLOC=y
	CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
	CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
	CONFIG_ESPTOOLPY_FLASHFREQ="80m"
	CONFIG_LIBSODIUM_USE_MBEDTLS_SHA=n
	CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
	CONFIG_ESPTOOLPY_FLASHSIZE_16MB=n
	CONFIG_CXX_EXCEPTIONS=y
	; Move code (.text) and read-only data (.rodata) to XIP-PSRAM.
	; This shifts the SRAM1 IRAM/DRAM boundary downward, growing the
	; DRAM heap by ~15–40 KB (depending on how much IDF/Arduino code
	; was living in IRAM).  Disabled in Tasmota's default sdkconfig.defaults;
	; explicit override needed here.
	CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
	CONFIG_SPIRAM_RODATA=y
	; With code in PSRAM, use a 32 KB instruction cache (vs Tasmota's 16 KB
	; default) so hot code paths stay warm in cache.  Costs 16 KB of SRAM0
	; that would otherwise be IRAM, but IRAM is largely vacated by FETCH_INSTRUCTIONS.
	CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
	CONFIG_ESP32S3_DATA_CACHE_32KB=y
	CONFIG_ESP32S3_DATA_CACHE_LINE_32B=y
	; Tighten the Arduino loop-task stack to match the build-flag value.
	; HWM at display_alloc() was only ~2 KB used; 6 KB is a safe ceiling.
	CONFIG_ARDUINO_LOOP_STACK_SIZE=6144

[env:display-dwc-jc3248w535c]
extends = env:display-jc3248w535c
build_flags = ${env:display-jc3248w535c.build_flags}
	-D DWC_MACHINE_MODE=1
lib_deps =

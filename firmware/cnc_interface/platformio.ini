upload_speed            = 921600
build_src_filter         = +<*> +<../lvgl_ui/lu_utils.c> -<driver/esp_lvgl/*.cpp> +<driver/esp_lvgl/simd/*.S> -<driver/esp_lvgl/simd/lv_color_blend_to_argb8888_esp32.S> -<driver/esp_lvgl/simd/lv_color_blend_to_rgb565_esp32.S> -<driver/esp_lvgl/simd/lv_color_blend_to_rgb888_esp32.S> -<driver/esp_lvgl/ppa> -<data/img/img_probe_icon_*>
custom_sdkconfig        = CONFIG_ESP_CONSOLE_USB_CDC=y
                          CONFIG_TINYUSB_CDC_ENABLED=y
                          CONFIG_TINYUSB_ENABLED=y
                          CONFIG_USB_CDC_RX_BUFSIZE=64
                          CONFIG_USB_CDC_TX_BUFSIZE=64
                          CONFIG_ESP_COREDUMP_ENABLE_TO_UART=y
                          CONFIG_ESP_COREDUMP_UART_DELAY=0
                          CONFIG_MONITOR_BAUD=115200
                          CONFIG_BOOTLOADER_LOG_LEVEL_INFO=y
                          CONFIG_LOG_DEFAULT_LEVEL_DEBUG=y
                          CONFIG_LOG_MAXIMUM_LEVEL_DEBUG=y
                          CONFIG_COMPILER_OPTIMIZATION_PERF=y
                         


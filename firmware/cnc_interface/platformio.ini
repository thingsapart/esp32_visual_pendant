; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = ESP32-based visual CNC pendant
src_dir = src
lib_dir = lib
boards_dir = boards
build_cache_dir = .pio
extra_configs = 

[base_config]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_echo = yes
check_skip_packages = yes
lib_archive = no
lib_ldf_mode = chain
lib_compat_mode = strict
shared_libdeps_dir = lib
lib_extra_dirs = 

[base_config_native]
monitor_speed = 115200
monitor_echo = yes
check_skip_packages = yes
lib_archive = no
lib_ldf_mode = chain
lib_compat_mode = strict
shared_libdeps_dir = lib
lib_extra_dirs = 

[pendant]
build_unflags = 
build_flags = -I${PROJECT_DIR}/include

[esp_release]
extra_scripts = 
build_unflags = ${pendant.build_unflags}
build_flags = ${pendant.build_flags}
	-D LGFX_AUTODETECT=0
	-Wno-deprecated-declarations
	-mtarget-align
	-free
	-fipa-pta
	-Wreturn-type

[esp32_release]
build_unflags = ${esp_release.build_unflags}
	-mtarget-align
	-fexceptions
build_flags = ${esp_release.build_flags}
	-mno-target-align
	-fno-strict-aliasing
lib_ignore = 
extra_scripts = ${esp_release.extra_scripts}
monitor_filters = esp32_exception_decoder

[esp32_debug]
extends = esp32_release
build_unflags = ${esp32_release.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D LOG_LOCAL_LEVEL=0
build_flags = ${esp32_release.build_flags}
	-D CORE_DEBUG_LEVEL=5
	-D LOG_LOCAL_LEVEL=5
	-D PIOENV=\"${PIOENV}\"
	-D LOG_MAXIMUM_LEVEL_VERBOSE
	-D LOG_DEFAULT_LEVEL_WARNING
	-D LOG_TIMESTAMP_SOURCE_SYSTEM
	-D CONFIG_ARDUHAL_ESP_LOG=1
check_tool = cppcheck
check_flags = --enable=all
debug_tool = esp-prog
debug_init_break = tbreak setup

[platform32]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2025.04.30/platform-espressif32.zip
platform_packages = 
build_unflags = ${esp32_release.build_unflags}
build_flags = ${esp32_release.build_flags}

[esp32_build]
extends = esp32_debug

[flash_4mb]
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

[flash_8mb]
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

[flash_16mb]
board_upload.flash_size = 16MB
board = esp32s3_qio_opi
board_upload.maximum_size = 16777216

[env:pendant32_base]
platform = ${platform32.platform}
platform_packages = ${platform32.platform_packages}
board_build.filesystem = ${base_config.board_build.filesystem}
board_upload.flash_size = 8MB
board = esp32
monitor_speed = ${base_config.monitor_speed}
monitor_echo = ${base_config.monitor_echo}
check_skip_packages = ${base_config.check_skip_packages}
monitor_filters = ${esp32_build.monitor_filters}
lib_ldf_mode = ${base_config.lib_ldf_mode}
lib_compat_mode = ${base_config.lib_compat_mode}
lib_extra_dirs = ${base_config.lib_extra_dirs}
	./lvgl_ui/pio_library
lib_ignore = ${esp32_build.lib_ignore}
build_unflags = ${esp32_build.build_unflags}
build_flags = ${esp32_build.build_flags}
	; LVGL v9 allocator: use the system heap (ESP-IDF malloc) instead of the
	; 64 KB builtin TLSF pool.  LV_STDLIB_CLIB=1 in LVGL v9 is the correct
	; replacement for the v8-era LV_MEM_CUSTOM=1 that was set in the emulator
	; env but ignored by LVGL v9 on hardware targets.
	;-D LV_USE_STDLIB_MALLOC=1
	-Iinclude
	-I lvgl_ui
	-I${PROJECT_DIR}/src/
	-I${sysenv.HOME}/.platformio/**
	-D ESP32_HW
	-D ESP32_HW=1
	-D BOARD_HAS_PSRAM
	;-D ARDUINO_LOOP_STACK_SIZE=10280
	-D ARDUINO_RUNNING_CORE=1
	-D VER_MAJ=0
	-D VER_MIN=0
	-D VER_REV=1
	-D LGFX_USE_V1=1
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_COMP_CONF_INCLUDE_SIMPLE
	-D LV_PNG_USE_LV_FILESYSTEM=1
	-D LV_USE_FILESYSTEM=1
	-D LITTLEFS=LittleFS
	-D LV_USE_FS_ARDUINO_ESP_LITTLEFS=1
board_build.f_cpu = 240000000L
lib_deps = 
	https://github.com/lvgl/lvgl
	git+https://github.com/DaveGamble/cJSON.git
	symlink://lvgl_ui/pio_library
	# https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
extra_scripts = 
	tools/prepend_path.py
	tools/littlefsbuilder.py
	tools/esp_merge_bin.py
	tools/analyze_elf.py

[env:display32]
framework = arduino
extends = env:pendant32_base
build_flags = ${env:pendant32_base.build_flags}
	-D APP_PENDANT
	-D LVGL_UI_RUNTIME
lib_extra_dirs = ${env:pendant32_base.lib_extra_dirs}
build_src_filter = +<*> -<driver/esp_lvgl/ppa>
lib_deps = ${env:pendant32_base.lib_deps}
	#https://github.com/esp-arduino-libs/ESP32_Display_Panel.git

[env:display32c3]
extends = env:display32
board = esp32c3
build_flags = ${env:display32.build_flags}
lib_ignore = ${env:display32.lib_ignore}
lib_extra_dirs = ${env:display32.lib_extra_dirs}
lib_deps = ${env:pendant32_base.lib_deps}
		#https://github.com/esp-arduino-libs/ESP32_Display_Panel.git

; ─────────────────────────────────────────────────────────────────────────────
; Waveshare / Sunton ESP32-2424S012C — 1.28" round 240×240 IPS, ESP32-C3-MINI-1U
;   Display : GC9A01 (SPI2)   MOSI=7 SCLK=6 CS=10 DC=2 RST=NC BL=3
;   Touch   : CST816S (I2C0)  SDA=4 SCL=5 RST=1 INT=0
;   Flash   : 4 MB, no PSRAM
;   Machine : ESP-NOW machine_remote only (no serial RRF — saves RAM)
; ─────────────────────────────────────────────────────────────────────────────
[env:display-esp32-2424s012]
extends = env:display32c3
board = esp32c3
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = config/esp32/partitions_4MB.csv

; Strip Xtensa-only flags that the RISC-V (C3) toolchain rejects, and remove
; defines that need overriding for a single-core, no-PSRAM target.
build_unflags = ${env:display32c3.build_unflags}
	-mno-target-align
	-mtarget-align
	-free
	-D BOARD_HAS_PSRAM
	-D ARDUINO_RUNNING_CORE=1

build_flags = ${env:display32c3.build_flags}
	; ── ESP32-C3 single-core / no-PSRAM corrections ───────────────────────────
	-UBOARD_HAS_PSRAM
	-D ARDUINO_RUNNING_CORE=0
	-DTASK_MACHINE_CORE=0
	-D TASK_MACHINE_STATE_PROC_CORE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	; ── Display — GC9A01 via SPI2 ─────────────────────────────────────────────
	-D ESP32_2424S012=1
	-D GC9A01_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MOSI=7
	-D TFT_SCLK=6
	-D TFT_CS=10
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BCKL=3
	; ── Touch — CST816S via I2C0 ──────────────────────────────────────────────
	-D I2C_TOUCH_PORT=0
	-D I2C_TOUCH_ADDRESS=0x15
	-D I2C_TOUCH_FREQUENCY=400000
	-D TOUCH_SDA=4
	-D TOUCH_SCL=5
	-D TOUCH_INT=0
	-D TOUCH_RST=1
	; ── Machine / comms ───────────────────────────────────────────────────────
	; No serial connection to an RRF controller.  ESP-NOW remote only.
	; Skips multi_machine_interface to conserve the limited internal RAM.
	-D MACHINE_REMOTE_ONLY=1
	; ── LVGL colour ───────────────────────────────────────────────────────────
	-D LV_COLOR_16_SWAP=0
	; ── Memory — keep task stacks small on the 300 KB RISC-V heap ────────────
	; Arduino loop task stack.  Default is 10280; 4096 saves ~6 KB of heap.
	-D ARDUINO_LOOP_STACK_SIZE=4096
	; Disable the LittleFS LVGL filesystem shim — LittleFS isn't usable without
	; a correct partition table and wastes time and a little RAM on mount.
	-D LV_USE_FS_ARDUINO_ESP_LITTLEFS=0
	-D NO_TOUCH_CAL=1
	-D ARDUINO_LOOP_STACK_SIZE=4096


; Exclude Xtensa SIMD assembly, the esp-lcd display-panel layer (unused here),
; and all other board-specific drivers.
build_src_filter = +<*>
	-<driver/esp_lvgl>
	-<driver/guition_4848s040.cpp>
	-<driver/jc_1060p470.cpp>
	-<driver/jc_8012p4a1.cpp>
	-<driver/wt32_sc01_plus.cpp>
	-<driver/gt911_touch>
	-<driver/jc1060p470>
	-<driver/jc8012p4a1>
	-<driver/c6_bridge_sdio.c>

; Override LovyanGFX to the GitHub HEAD.
; The PlatformIO registry release predates the IDF-5.x ESP32-C3 GPIO register
; rename (in_sel/out_sel → func_sel in gpio_func_in/out_sel_cfg_reg_t), which
; causes a compile error in lgfx/v1/platforms/esp32/common.cpp on C3 targets.
; Even git HEAD has the bug; tools/patch_lgfx_c3.py patches it in-place.
lib_deps =
	https://github.com/lovyan03/LovyanGFX.git
	https://github.com/lvgl/lvgl
	git+https://github.com/DaveGamble/cJSON.git
	symlink://lvgl_ui/pio_library

; Apply the IDF-5.x C3 GPIO struct rename fix to LovyanGFX before compilation.
; On the very first build the libdeps directory doesn't exist yet; PlatformIO
; will report the warning and the patch runs correctly on the second invocation.
extra_scripts = pre:tools/patch_lgfx_c3.py

upload_speed = 460800


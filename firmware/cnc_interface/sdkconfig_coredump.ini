# ─────────────────────────────────────────────────────────────────────────────
# Coredump-to-flash settings.
# Referenced via  custom_sdkconfig = file://./sdkconfig_coredump.ini  so that
# the Kconfig "not-set" comment lines (#) reach HandleArduinoIDFsettings raw
# (PlatformIO's configparser strips # lines from inline custom_sdkconfig values).
# ─────────────────────────────────────────────────────────────────────────────
CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y
# CONFIG_ESP_COREDUMP_ENABLE_TO_UART is not set
# CONFIG_ESP_COREDUMP_ENABLE_TO_NONE is not set
CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=y
CONFIG_ESP_COREDUMP_CHECKSUM_CRC32=y
CONFIG_ESP_COREDUMP_CHECK_BOOT=y
CONFIG_ESP_COREDUMP_ENABLE=y
CONFIG_ESP_COREDUMP_MAX_TASKS_NUM=64
CONFIG_ESP_COREDUMP_STACK_SIZE=1024

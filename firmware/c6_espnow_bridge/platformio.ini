; PlatformIO Project Configuration File
; ESP32-C6 ESP-NOW ↔ UART Bridge Firmware
;
; This firmware runs on the ESP32-C6 sidecar chip present on P4+C6 boards
; (e.g. JC8012P4A1, JC1060P470, etc.).  It bridges ESP-NOW wireless packets
; to a binary-framed UART that the ESP32-P4 main chip reads.
;
; Wiring (two wires between PROG_C6 header and a free P4 GPIO header):
;   C6 TX (C6_BRIDGE_UART_TX) ----> P4 RX (C6_BRIDGE_UART_RX on P4 side)
;   C6 RX (C6_BRIDGE_UART_RX) ----> P4 TX (C6_BRIDGE_UART_TX on P4 side)
;   GND <---> GND  (must share ground - usually already shared on board)
;
; To flash: use the PROG_C6 six-pin header on the board with an ESP-Prog or
; any USB-UART adapter (hold IO0 low while pressing EN to enter bootloader).

[platformio]
description   = ESP32-C6 ESP-NOW ↔ UART bridge for P4 pendant boards
extra_configs = ../shared_build.ini

[env:c6_bridge_base]
platform      = ${shared_platform_tasmota.platform}
platform_packages = ${shared_platform_tasmota.platform_packages}
framework     = ${shared_base_config.framework}
board         = esp32-c6-devkitc-1

monitor_speed = ${shared_base_config.monitor_speed}
monitor_echo  = ${shared_base_config.monitor_echo}
check_skip_packages = ${shared_base_config.check_skip_packages}
lib_archive   = ${shared_base_config.lib_archive}
lib_ldf_mode  = ${shared_base_config.lib_ldf_mode}
lib_compat_mode = ${shared_base_config.lib_compat_mode}

build_unflags = ${shared_base_build_flags.build_unflags}

upload_speed = 921600
; upload_speed = 460800
; upload_speed = 230400
; upload_speed = 115200
; upload_speed = 57600

build_flags = ${shared_base_build_flags.build_flags}
    ; ---- ESP-NOW channel ----
    ; Must match the channel your hub (ESP32-S3 or other) is using.
    ; Hub auto-detects channel from the AP it is associated with, or uses
    ; channel 1 when running in STA mode without AP.
    -D C6_BRIDGE_WIFI_CHANNEL=1

[env:c6_bridge]
extends = env:c6_bridge_base
build_flags = ${env:c6_bridge_base.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; ---- UART pins (C6 side) ----
    ; UART0 is used for the bridge so its physical pins appear directly on the
    ; PROG_C6 six-pin debug header (TXD / RXD).  With ARDUINO_USB_CDC_ON_BOOT=1
    ; Arduino's "Serial" maps to the internal USB-CDC controller, so console
    ; output does NOT conflict with bridge frames on UART0.
    ;
    ; Wiring (just 2 signal wires — GND is shared on-board):
    ;   PROG_C6 TXD (C6 GPIO16) ----> P4 GPIO C6_BRIDGE_UART_RX (default GPIO5)
    ;   PROG_C6 RXD (C6 GPIO17) <---- P4 GPIO C6_BRIDGE_UART_TX (default GPIO4)
    -D C6_BRIDGE_UART_NUM=0
    ; GPIO16 = UART0 TX (default C6 console pin, free in SDIO mode)
    ; GPIO17 = UART0 RX (default C6 console pin, free in SDIO mode)
    ; NOTE: GPIO31 does not exist on ESP32-C6 (SOC_GPIO_OUT_RANGE_MAX=30).
    -D C6_BRIDGE_UART_TX=16
    -D C6_BRIDGE_UART_RX=17
    -D C6_BRIDGE_UART_BAUD=115200

; ─────────────────────────────────────────────────────────────────────────────
; SDIO variant  —  for boards where the C6 and P4 are connected via the
; on-board SDIO bus (e.g. JC8012P4A1, JC1060P470).  No external wires needed.
;
; The SDIO slave GPIO are fixed in silicon on the C6:
;   CLK = GPIO19   CMD = GPIO18
;   D0  = GPIO20   D1  = GPIO21   D2 = GPIO22   D3 = GPIO23
; ─────────────────────────────────────────────────────────────────────────────
[env:c6_bridge_sdio]
extends       = env:c6_bridge
; In SDIO mode the SDIO bus uses GPIO18-23, leaving the default UART0 pins
; (GPIO16=TX, GPIO17=RX) free.  The ROM bootloader and second-stage bootloader
; already output on those pins at 115200 — no sdkconfig overrides are needed.
; Serial  = USB-CDC (ARDUINO_USB_CDC_ON_BOOT=1 inherited, Serial != Serial0)
; Serial0 = hardware UART0 on GPIO16 (TX) / GPIO17 (RX) at 115200
build_flags = ${env:c6_bridge.build_flags}
    ; ---- Select SDIO slave transport instead of UART ----
    -D C6_BRIDGE_TRANSPORT_SDIO
    ; Enable ESP-IDF/Arduino esp_log info-level output for this build
    -D LOG_LOCAL_LEVEL=5
    ; ---- SDIO slave tuning (all optional, defaults shown) ----
    ; -D C6_BRIDGE_SDIO_BUS_WIDTH=4          ; 1 or 4
    ; -D C6_BRIDGE_SDIO_RX_BUF_COUNT=4       ; host→slave DMA buffer pool depth
    ; -D C6_BRIDGE_SDIO_TX_BUF_COUNT=4       ; slave→host DMA buffer pool depth
    ; ---- Logging ----
    -D C6_BRIDGE_LOG_EXT   ; enables per-packet + periodic stats on both C6 and P4 SDIO transport
